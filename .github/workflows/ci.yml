name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint + paper demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m compileall -q -f .
          echo "compileall OK"

      - name: Validate config.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          assert cfg.get("symbol") == "367380"
          assert cfg["grid"]["levels"] == 5
          assert float(cfg["grid"]["spacing_pct"]) == 0.002
          assert float(cfg["grid"]["tp_pct"]) == 0.002
          assert cfg.get("cooldown", {}).get("enabled") is True
          assert cfg.get("safety_freeze", {}).get("enabled") is True
          tg = cfg.get("telegram") or {}
          assert "chat_id" not in tg, "chat_id must not be committed"
          print("config OK:", cfg["symbol"], cfg["grid"]["levels"], "levels")
          PY

      - name: Guard against committed secrets
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          # Patterns only in this step. Workflow filenames are skipped.
          # Numeric chat_id is blocked in the config.json step above.
          pats = [
              re.compile(r"TELEGRAM_BOT_TOKEN\s*[:=]\s*['\"][^'\"]+"),
              re.compile(r"gho_[A-Za-z0-9]{20,}"),
              re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              re.compile(r"BEGIN (RSA |OPENSSH )?PRIVATE"),
              re.compile(r"app[_-]?secret\s*[:=]\s*['\"][^'\"]+", re.I),
              re.compile(r"app[_-]?key\s*[:=]\s*['\"][^'\"]+", re.I),
          ]
          files = subprocess.check_output(
              ["git", "ls-files", "*.py", "*.json", "*.md", "*.yml", "*.yaml", "*.sh", "*.html"],
              text=True,
          ).splitlines()
          bad = []
          for rel in files:
              if rel.startswith(".github/workflows/"):
                  continue
              text = Path(rel).read_text(encoding="utf-8", errors="ignore")
              for pat in pats:
                  if pat.search(text):
                      bad.append(f"{rel}: matched {pat.pattern}")
          if bad:
              print("Possible secret found:")
              print("\n".join(bad[:50]))
              raise SystemExit(1)
          print("secret guard OK")
          PY

      - name: Ops guards unit tests
        run: |
          python -m unittest test_ops_guards -v

      - name: Portfolio dashboard unit tests
        run: |
          DASHBOARD_SKIP_KIS=1 python -m unittest test_portfolio_dashboard -v

      - name: Paper demo (no live orders)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          cfg.setdefault("persistence", {})["file"] = str(Path("positions.ci.json").resolve())
          Path("config.ci.json").write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("wrote config.ci.json")
          PY
          python main.py --mode paper --scenario demo --config config.ci.json

      - name: Cleanup CI artifacts
        if: always()
        run: rm -f positions.ci.json config.ci.json
